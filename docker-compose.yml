# Запуск сервиса «Ноготочки» одним описанием: собирает образ по Dockerfile из этой же папки
# и поднимает один контейнер — он отдает и API, и сайт.
#
#   docker compose up -d --build     # запустить или обновить
#   docker compose logs -f           # журнал сервера (в нем пароль первого администратора)
#   docker compose down              # остановить; данные остаются в томе nogotochki-data
#
# Секретов в этом файле нет и быть не должно: репозиторий хранит историю, и пароль из нее уже не убрать.
# Пароль почты и, если нужно, пароль администратора задаются в панели сервера (в Coolify — раздел
# Environment Variables) либо в файле .env рядом с этим описанием; .env в репозиторий не попадает.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Контейнер поднимается сам после перезагрузки сервера и после падения.
    restart: unless-stopped

    # Порт сервиса. Слева — порт сервера, справа — порт внутри контейнера (его же задает PORT).
    # Прокси панели направляет сюда домен, поэтому в панели порт указывать не нужно.
    ports:
      - "3000:3000"

    environment:
      # --- Адрес сервиса: из него строятся ссылки в письмах, в production нужен https ---
      APP_URL: https://buty.topbrohuman.ru

      # --- Данные: все лежит в томе nogotochki-data, подключенном как /data (см. volumes ниже) ---
      # Файл базы. Образ задает тот же путь, здесь он написан явно, чтобы было видно связь с томом.
      DATABASE_PATH: /data/db/nogotochki.db
      BACKUP_DIR: /data/backups
      UPLOADS_DIR: /data/uploads

      # Порт внутри контейнера; меняя его, поменяйте и правую часть в ports.
      PORT: "3000"

      # Сервис стоит за прокси панели, поэтому IP клиента берется из заголовка X-Forwarded-For:
      # без этого ограничение частоты запросов считало бы всех клиентов одним.
      TRUST_PROXY: "1"

      # --- Вход через Яндекс: заглушка выключена ---
      # Заглушка пускает в аккаунт по нажатию кнопки, под любой почтой из настроек, без проверки
      # человека. Она нужна была, пока у сервиса не было адреса. Здесь она выключена явно, но даже
      # если эту строку убрать, по умолчанию она выключена, а с NODE_ENV=production сервер
      # с включенной заглушкой не запускается вовсе (server/src/config.ts).
      YANDEX_LOGIN_STUB: "0"

      # --- Первый администратор ---
      # Учетная запись создается при первом запуске, только если администраторов в базе еще нет.
      # Пароль не задан намеренно: сервер придумает его сам и напечатает в журнал один раз
      # (docker compose logs). После входа смените его в профиле.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@topbrohuman.ru}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

      # --- Почта: восстановление пароля и подтверждение e-mail ---
      # Значения задаются в панели сервера. Пока их нет, сервис работает, но письма не отправляются.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}

    volumes:
      # Данные живут вне контейнера: контейнер пересобирается при каждом обновлении, а том остается.
      # Внутри тома: db/ — файл базы, backups/ — резервные копии, uploads/ — фото работ.
      - nogotochki-data:/data

    # Проверка «жив ли сервис» описана в Dockerfile: панель видит контейнер здоровым,
    # только когда API отвечает.

volumes:
  nogotochki-data:
