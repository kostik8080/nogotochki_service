<!--
  Значок вкладки браузера. Та же эмблема, что в шапке сайта и на иконке приложения (img/app-icon.svg),
  но нарисована под мелкий размер: обводка плотнее (2 вместо 1.3) и цветок меньше относительно поля —
  на 16 пикселях тонкие линии исходной эмблемы сливаются в пятно.
  Цвета из web/tokens.css: фон color-bg #0F0B0C, эмблема color-brand-gold #C2A278.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img"
     aria-label="Ноготочки">
  <rect width="64" height="64" rx="12" fill="#0F0B0C"/>
  <g transform="translate(9.5 9.5) scale(1.125)" fill="none" stroke="#C2A278" stroke-width="2">
    <ellipse cx="20" cy="14" rx="5" ry="11"/>
    <ellipse cx="20" cy="14" rx="5" ry="11" transform="rotate(72 20 20)"/>
    <ellipse cx="20" cy="14" rx="5" ry="11" transform="rotate(144 20 20)"/>
    <ellipse cx="20" cy="14" rx="5" ry="11" transform="rotate(216 20 20)"/>
    <ellipse cx="20" cy="14" rx="5" ry="11" transform="rotate(288 20 20)"/>
  </g>
</svg>
