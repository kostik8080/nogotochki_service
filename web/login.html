<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Ноготочки</title>
  <!-- Значок вкладки: эмблема студии (favicon.svg), крупная иконка — для закладок и телефона -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="img/app-icon.png" type="image/png" sizes="512x512">
  <link rel="apple-touch-icon" href="img/app-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/auth.css">
  <script type="module" src="js/header.js"></script>
  <script type="module" src="js/login.js"></script>
</head>
<body class="auth-body">
  <!-- Общая шапка клиента: разметка и данные — js/header.js -->
  <client-header></client-header>

  <!-- AUTH-01 Вход. Ссылка прототипа «Войти по коду из SMS» не перенесена: SMS в сервисе нет (docs/ui-map.md, пункт 8) -->
  <main class="auth" data-theme="powder">
    <section class="auth__card" aria-labelledby="login-title">
      <h1 class="auth__title" id="login-title">Вход</h1>
      <p class="auth__lead">Рады видеть вас снова</p>

      <form class="form" data-login-form novalidate>
        <div class="alert" role="alert" data-alert hidden></div>

        <div class="field">
          <label class="field__label" for="login">Телефон или e-mail</label>
          <input class="input" id="login" name="login" type="text" autocomplete="username" inputmode="email"
                 autocapitalize="off" spellcheck="false" aria-describedby="login-error">
          <p class="field__error" id="login-error" data-error-for="login" hidden></p>
        </div>

        <div class="field">
          <label class="field__label" for="password">Пароль</label>
          <div class="password">
            <input class="input" id="password" name="password" type="password" autocomplete="current-password"
                   aria-describedby="password-error">
            <button class="password__toggle" type="button" aria-controls="password" aria-pressed="false" data-password-toggle>Показать</button>
          </div>
          <p class="field__error" id="password-error" data-error-for="password" hidden></p>
        </div>

        <button class="btn btn--primary btn--block" type="submit">Войти</button>
      </form>


      <!-- Вход через Яндекс в один клик. В прототипе кнопки нет: функция появилась после него
           (docs/ui-map.md, список 2, пункт 7). Кнопка оформлена по требованиям Яндекса
           (дополнительная версия, светлая тема, размер L), а не по токенам проекта: текст,
           иконку и отступы внутри кнопки менять нельзя. Подробности — в css/auth.css -->
      <div class="auth__divider"><span>или</span></div>

      <button class="ya-id-button" type="button" data-yandex-login>
        <span class="ya-id-button__logo" aria-hidden="true"></span>
        <span class="ya-id-button__text">Войти с Яндекс ID</span>
      </button>
      <p class="auth__note">Яндекс сообщит студии только имя и адрес электронной почты. Если аккаунта еще нет, он создастся,
        и вы соглашаетесь на обработку <a class="text-link" href="privacy.html" target="_blank" rel="noopener">персональных данных</a>.</p>

      <div class="auth__links">
        <a class="text-link" href="forgot-password.html">Забыли пароль?</a>
        <a class="text-link" href="register.html">Нет аккаунта? Зарегистрироваться</a>
      </div>
    </section>
  </main>

  <footer class="page-footer">
    <div class="container page-footer__inner">
      <span>© Ноготочки, бьюти-студия</span>
      <span class="page-footer__links">
        <a href="privacy.html">Политика обработки персональных данных</a>
      </span>
    </div>
  </footer>
</body>
</html>
