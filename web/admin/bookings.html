<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Страницу отдает сервер API по адресу /admin только администратору (server/src/web/admin-pages.ts).
       Все относительные адреса — от корня сайта: страница открывается не из корня. -->
  <base href="/">
  <title>Записи — раздел администратора — Ноготочки</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/admin.css">
  <script type="module" src="js/header.js"></script>
  <script type="module" src="js/admin.js"></script>
</head>
<body class="admin-body">
  <a class="skip-link" href="/admin#main">К содержимому</a>

  <!-- Общая шапка сервиса: логотип и меню аккаунта — js/header.js -->
  <client-header></client-header>

  <div class="admin">
    <!-- Меню раздела «Записи», «Услуги», «Мастера»: появляется после проверки роли — js/admin.js -->
    <admin-nav></admin-nav>

    <!-- A-01 Шахматка (docs/ui-map.md, «Раздел администратора») -->
    <main class="admin__main" id="main" data-theme="admin" data-admin-main>
      <div class="admin__loading" data-view="loading" aria-busy="true">
        <span class="skeleton skeleton--heading" aria-hidden="true"></span>
        <span class="visually-hidden">Загружаем раздел…</span>
      </div>

      <div class="admin-state" role="alert" data-view="error" hidden>
        <p class="admin-state__title">Не удалось открыть раздел</p>
        <p class="admin-state__text" data-error-text></p>
        <div class="admin-state__actions">
          <button class="btn btn--primary btn--small" type="button" data-retry>Повторить</button>
        </div>
      </div>

      <div data-view="content" hidden>
        <p class="admin__eyebrow">Раздел администратора</p>
        <h1 class="admin__title">Записи</h1>

        <!-- Пока пусто: данные экрана подключаются в следующей итерации -->
        <div class="admin-state">
          <div class="admin-state__icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/></svg>
          </div>
          <p class="admin-state__title">Раздел в работе</p>
          <p class="admin-state__text">Здесь появятся записи всех клиентов по мастерам на день и неделю: создание, перенос и отмена записи.</p>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
