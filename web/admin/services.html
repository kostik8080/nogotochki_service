<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Страницу отдает сервер API по адресу /admin/services только администратору (server/src/web/admin-pages.ts).
       Все относительные адреса — от корня сайта: страница открывается не из корня. -->
  <base href="/">
  <title>Услуги — раздел администратора — Ноготочки</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/admin.css">
  <script type="module" src="js/header.js"></script>
  <script type="module" src="js/admin.js"></script>
  <script type="module" src="js/admin-services.js"></script>
</head>
<body class="admin-body">
  <a class="skip-link" href="/admin/services#main">К содержимому</a>

  <!-- Общая шапка сервиса: логотип и меню аккаунта — js/header.js -->
  <client-header></client-header>

  <div class="admin">
    <!-- Меню раздела «Записи», «Услуги», «Мастера»: появляется после проверки роли — js/admin.js -->
    <admin-nav></admin-nav>

    <!-- A-23 Услуги (docs/ui-map.md, «Раздел администратора») -->
    <main class="admin__main" id="main" data-theme="admin" data-admin-main>
      <div class="admin__loading" data-view="loading" aria-busy="true">
        <span class="skeleton skeleton--heading" aria-hidden="true"></span>
        <span class="visually-hidden">Загружаем раздел…</span>
      </div>

      <div class="admin-state" role="alert" data-view="error" hidden>
        <p class="admin-state__title">Не удалось открыть раздел</p>
        <p class="admin-state__text" data-error-text></p>
        <div class="admin-state__actions">
          <button class="btn btn--primary btn--small" type="button" data-retry>Повторить</button>
        </div>
      </div>

      <div data-view="content" hidden>
        <p class="alert admin-flash" role="status" data-flash hidden></p>

        <div class="admin-head">
          <div>
            <p class="admin__eyebrow">Раздел администратора</p>
            <h1 class="admin__title">Услуги</h1>
          </div>
          <div class="admin-head__actions">
            <button class="btn btn--outline btn--small" type="button" data-add-category>+ Категория</button>
            <a class="btn btn--primary btn--small" href="/admin/services/form">+ Добавить услугу</a>
          </div>
          <p class="admin-head__summary" data-summary></p>
        </div>

        <!-- Новая категория: без нее не завести ни одной услуги -->
        <form class="admin-inline-form" data-category-form hidden novalidate>
          <div class="field">
            <label class="field__label" for="category-name">Название категории</label>
            <input class="input" id="category-name" name="name" maxlength="100" autocomplete="off">
            <p class="field__error" data-error-for="name" hidden></p>
          </div>
          <button class="btn btn--primary btn--small" type="submit">Добавить</button>
          <button class="btn btn--outline btn--small" type="button" data-category-cancel>Отмена</button>
          <div class="alert" role="alert" data-category-alert hidden></div>
        </form>

        <div data-page-loading aria-busy="true">
          <span class="skeleton skeleton--line" aria-hidden="true"></span>
          <span class="skeleton skeleton--line skeleton--short" aria-hidden="true"></span>
          <span class="visually-hidden">Загружаем данные…</span>
        </div>
        <div class="alert alert--error" role="alert" data-page-error hidden></div>

        <!-- Категории и услуги, включая отключенные — js/admin-services.js -->
        <div data-list></div>
      </div>
    </main>
  </div>
</body>
</html>
