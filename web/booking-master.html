<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Запись: мастер — Ноготочки</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/booking.css">
  <script type="module" src="js/header.js"></script>
  <script type="module" src="js/booking-steps.js"></script>
  <script type="module" src="js/booking-master.js"></script>
</head>
<body class="booking-body">
  <a class="skip-link" href="#main">К содержимому</a>

  <!-- Общая шапка клиента — js/header.js -->
  <client-header></client-header>

  <!-- BOOK-02 Шаг 2. Мастер -->
  <main class="booking" id="main" data-theme="powder">
    <div class="container booking__inner">
      <div class="booking-bar">
        <a class="btn btn--neutral btn--small" href="booking-services.html">← Назад</a>
        <booking-steps current="master"></booking-steps>
      </div>

      <h1 class="visually-hidden">Запись: выберите мастера</h1>

      <!-- Сводка визита: сумма и длительность — от сервера; «Изменить» → шаг «Услуги» -->
      <div class="visit-summary">
        <span class="visit-summary__text" data-summary aria-live="polite"><span class="skeleton skeleton--line" aria-hidden="true"></span></span>
        <a class="text-link" href="booking-services.html">Изменить</a>
      </div>

      <!-- Мастера — из GET /api/masters?services=… (подходят) и GET /api/masters (все). Пока грузятся — заглушки -->
      <div class="master-list" data-masters aria-busy="true">
        <div class="skeleton-card" aria-hidden="true"><span class="skeleton skeleton--title"></span><span class="skeleton skeleton--line skeleton--short"></span></div>
        <div class="skeleton-card" aria-hidden="true"><span class="skeleton skeleton--title"></span><span class="skeleton skeleton--line skeleton--short"></span></div>
        <div class="skeleton-card" aria-hidden="true"><span class="skeleton skeleton--title"></span><span class="skeleton skeleton--line skeleton--short"></span></div>
        <div class="skeleton-card" aria-hidden="true"><span class="skeleton skeleton--title"></span><span class="skeleton skeleton--line skeleton--short"></span></div>
        <span class="visually-hidden">Загружаем мастеров…</span>
      </div>
    </div>
  </main>

  <!-- Плашка внизу: кого выбрали и «Далее», как на шаге «Услуги» -->
  <section class="cart" aria-label="Ваш визит">
    <div class="container cart__inner">
      <div class="cart__bar">
        <span class="cart__summary">
          <span class="cart__total" data-total aria-live="polite">Мастер не выбран</span>
          <span class="cart__hint" id="cart-hint" data-hint>Выберите мастера или «Любой свободный мастер»</span>
        </span>
        <button class="btn btn--primary cart__next" type="button" aria-describedby="cart-hint" data-next disabled>Далее</button>
      </div>
    </div>
  </section>
</body>
</html>
