<!--
  Иконка приложения «Ноготочки» для страницы согласия Яндекса (oauth.yandex.ru).
  Та же эмблема, что в шапке сайта (web/js/header.js): пять лепестков.
  Цвета из web/tokens.css: фон color-bg #0F0B0C, эмблема color-brand-gold #C2A278.
  Новых значений не добавлено.

  Фон залит целиком, без скругления: если сервис обрежет иконку в круг, углы не станут прозрачными.
  Готовый PNG рядом — app-icon.png, 512 на 512.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img"
     aria-label="Ноготочки, бьюти-студия">
  <rect width="512" height="512" fill="#0F0B0C"/>
  <g transform="translate(69 69) scale(9.35)" fill="none" stroke="#C2A278" stroke-width="1.3">
    <ellipse cx="20" cy="14" rx="5" ry="11"/>
    <ellipse cx="20" cy="14" rx="5" ry="11" transform="rotate(72 20 20)"/>
    <ellipse cx="20" cy="14" rx="5" ry="11" transform="rotate(144 20 20)"/>
    <ellipse cx="20" cy="14" rx="5" ry="11" transform="rotate(216 20 20)"/>
    <ellipse cx="20" cy="14" rx="5" ry="11" transform="rotate(288 20 20)"/>
  </g>
</svg>
