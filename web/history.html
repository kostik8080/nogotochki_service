<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>История — Ноготочки</title>
  <!-- Значок вкладки: эмблема студии (favicon.svg), крупная иконка — для закладок и телефона -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="img/app-icon.png" type="image/png" sizes="512x512">
  <link rel="apple-touch-icon" href="img/app-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/cabinet.css">
  <link rel="stylesheet" href="css/account.css">
  <script type="module" src="js/header.js"></script>
  <script type="module" src="js/cabinet-nav.js"></script>
  <script type="module" src="js/history.js"></script>
</head>
<body class="cabinet-body">
  <a class="skip-link" href="#main">К содержимому</a>

  <!-- Общая шапка клиента — js/header.js -->
  <client-header></client-header>

  <div class="cabinet" data-theme="powder">
    <div class="container cabinet__inner">
      <!-- Меню кабинета — js/cabinet-nav.js; «История» — вкладка кабинета рядом с «Мои записи» -->
      <cabinet-nav></cabinet-nav>

      <!-- CAB-02 История -->
      <main class="cabinet__main" id="main">
        <h1 class="cabinet__title">История</h1>

        <div class="filters" role="group" aria-label="Какие визиты показать" data-filters hidden>
          <button class="filter" type="button" aria-pressed="true" data-filter="all">Все</button>
          <button class="filter" type="button" aria-pressed="false" data-filter="completed">Завершенные</button>
          <button class="filter" type="button" aria-pressed="false" data-filter="cancelled">Отмененные</button>
        </div>

        <div data-list aria-busy="true" aria-live="polite">
          <span class="skeleton skeleton--row history-skeleton" aria-hidden="true"></span>
          <span class="skeleton skeleton--row history-skeleton" aria-hidden="true"></span>
          <span class="skeleton skeleton--row history-skeleton" aria-hidden="true"></span>
          <span class="visually-hidden">Загружаем историю…</span>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
